<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intelligent Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/ft-icon.svg">
    <style>
        :root {
            /* Light Mode (Default) */
            --color-primary: #8B5CF6;
            --color-primary-dark: #7C3AED;
            --color-primary-light: #A78BFA;
            --color-secondary: #10B981;
            --color-danger: #EF4444;
            --color-warning: #F59E0B;
            --color-success: #22C55E;

            --color-background: #F3F4F6;
            --color-surface: #FFFFFF;
            --color-surface-light: #F9FAFB;

            --color-text-primary: #111827;
            --color-text-secondary: #4B5563;
            --color-text-muted: #9CA3AF;

            --color-border: #E5E7EB;
            --color-border-light: #D1D5DB;
        }

        .dark {
            /* Dark Mode (Original Theme) */
            --color-primary: #8B5CF6;
            --color-primary-dark: #7C3AED;
            --color-primary-light: #A78BFA;
            --color-secondary: #10B981;
            --color-danger: #EF4444;
            --color-warning: #F59E0B;
            --color-success: #22C55E;

            --color-background: #0F0F23;
            --color-surface: #1A1A2E;
            --color-surface-light: #252545;

            --color-text-primary: #FFFFFF;
            --color-text-secondary: #A1A1AA;
            --color-text-muted: #71717A;

            --color-border: #27272A;
            --color-border-light: #3F3F46;
        }

        /* Custom Scrollbar Styling */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--color-border-light) var(--color-surface);
        }

        /* Webkit browsers (Chrome, Safari, Edge) */
        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        *::-webkit-scrollbar-track {
            background: var(--color-surface);
            border-radius: 4px;
        }

        *::-webkit-scrollbar-thumb {
            background: var(--color-border-light);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }

        *::-webkit-scrollbar-corner {
            background: var(--color-surface);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: 'var(--color-primary)',
                            dark: 'var(--color-primary-dark)',
                            light: 'var(--color-primary-light)',
                        },
                        secondary: 'var(--color-secondary)',
                        danger: 'var(--color-danger)',
                        warning: 'var(--color-warning)',
                        success: 'var(--color-success)',
                        background: 'var(--color-background)',
                        surface: {
                            DEFAULT: 'var(--color-surface)',
                            light: 'var(--color-surface-light)',
                        },
                        'text-primary': 'var(--color-text-primary)',
                        'text-secondary': 'var(--color-text-secondary)',
                        'text-muted': 'var(--color-text-muted)',
                        border: {
                            DEFAULT: 'var(--color-border)',
                            light: 'var(--color-border-light)',
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    },
                    boxShadow: {
                        'custom-lg': '0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3)',
                        'custom': '0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2)',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-text-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
